# LLM client configuration
# This file is used by scripts/run_llm_query.py and src/llm_server/factory.py

# Supported server types: "ollama" or "vllm"
server_type: "ollama"

ollama:
  host: "127.0.0.1"
  port: 11434
  model: "llama3.1:8b"

vllm:
  host: "127.0.0.1"
  port: 8000
  model: "meta-llama/Llama-3.1-8B-Instruct"
